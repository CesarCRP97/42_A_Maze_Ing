# Guion de defensa: setuptools construye la distribución instalable.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generation package for A-Maze-ing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pydantic valida modelos y estructuras de configuración.
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "pytest",
    "build",
    "setuptools",
    "wheel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]
