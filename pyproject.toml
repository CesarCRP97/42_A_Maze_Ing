[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generation package for A-Maze-ing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
exclude = ["*"]
